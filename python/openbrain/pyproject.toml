[project]
name = "openbrain"
version = "0.1.0"
description = "Open Brain: the shared core, configuration, models, and capability modules that every Open Brain Python process is built from."
# The package README is GENERATED from the src/openbrain/__init__.py docstring
# by scripts/pytools/generate_package_docs.py. Pointing at the generated file
# rather than a hand-written one at the package root keeps a single source:
# a second README here would drift from the docstring immediately, and nothing
# would detect it.
readme = "src/openbrain/README.md"
requires-python = ">=3.13"
dependencies = [
    # Pydantic owns configuration and models: one validated, typed object rather
    # than a dict passed around. `docs/CODING_STANDARDS.md` section 3.
    #
    # This is a NEW dependency for this repo -- neither openbrain-memory nor
    # openbrain-provider uses it; both hand-roll frozen dataclasses with
    # __post_init__ validation. That works, but every package re-implements the
    # coercion and error-message logic, which is the duplication this tree
    # exists to stop.
    "pydantic>=2.9",
    # BaseSettings moved out of pydantic core in v2 and is its own package.
    "pydantic-settings>=2.5",
    # loguru, matching openbrain-provider. The shared rtech-obs package
    # implements the same envelope and would be the right dependency, but
    # rtech-standards is private and this repo's CI passes no token. See
    # openbrain-provider/pyproject.toml for the full note.
    "loguru>=0.7",
]

# [project.scripts] is deliberately absent. A declared entry point whose target
# module does not exist still installs an executable shim into .venv/bin and
# dies with ModuleNotFoundError when anything runs it -- and no lint, type, or
# test gate inspects entry-point targets, so a broken script ships green. The
# same trap as a mypy path that does not resolve. Entry points get declared when
# `cli/` has something to point at.

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    # Async tests, per docs/standards/STANDARDS-python.md:951. `asyncio_mode`
    # below is set to "auto" as that standard requires, so an `async def test_`
    # runs without a per-test decorator -- and, more to the point, a coroutine
    # test cannot be silently collected-and-never-awaited, which passes while
    # proving nothing.
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]    # so isort knows what "first party" means

# REQUIRED for PLR1702. Without it, ruff prints "Selection PLR1702 has no effect
# because preview is not enabled" and EXITS 0 -- the rule sits in `select`, the
# config looks right, and the nesting law never runs. Verified against
# docs/standards/python-exemplar/pyproject.toml:134.
#
# Same defect class as a mypy path that resolves to nothing, and as the qmd
# index enumerating directories that no longer describe the tree: a check that
# reports success while examining nothing. Do not remove this line to quiet a
# warning.
preview = true

[tool.ruff.lint]
# Named rule families, each with a reason. `select = ["ALL"]` is a trap -- it
# enables rules that contradict each other and rules that fight the formatter,
# and the noise trains people to write blanket ignores.
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes -- unused imports, undefined names
    "I",      # isort -- import ordering
    "N",      # pep8-naming
    "UP",     # pyupgrade -- keeps syntax current with the 3.13 floor
    "B",      # flake8-bugbear -- real bug patterns, e.g. mutable default args
    "A",      # flake8-builtins -- shadowing `id`, `type`, `list`
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez -- naive datetimes
    "T20",    # flake8-print -- no stray print() in library code
    "SIM",    # flake8-simplify
    # D = pydocstyle. Module (D100), package (D104), and class/function
    # (D101-D103) docstrings are gate failures, not warnings. The package rule
    # is what the docs generator depends on:
    # `scripts/pytools/generate_package_docs.py` reads the __init__.py
    # docstring, so an absent one has to fail here too.
    "D",
    # Control-flow shape. The LAW is "flat control flow"
    # (docs/standards/STANDARDS-python.md). Prose does not hold; PLR1702 is what
    # actually refuses.
    #
    # Named INDIVIDUALLY, not as the `PL` family. Selecting `PL` wholesale drags
    # in ~40 unrelated pylint rules (magic-value-comparison, too-many-arguments,
    # import-outside-top-level, ...) with nothing to do with control flow. Ten
    # of them fired on the exemplar's own correct code. That is how a rule set
    # becomes noise and people start writing blanket ignores. Add a rule when it
    # is wanted, not because it shares a prefix.
    "PLR1702",  # too-many-nested-blocks -- THE nested-block enforcement
    "PLR0912",  # too-many-branches -- the long if/elif chain
    "C901",     # mccabe complexity -- many small branches, collectively untestable
    "RET",      # flake8-return -- else-after-return, the usual cause of nesting
    "TRY",      # tryceratops -- try/except antipatterns
]

ignore = [
    # The formatter owns line wrapping. Leaving E501 on makes `ruff format` and
    # `ruff check` disagree about the same line, which is unwinnable.
    "E501",
    # D203/D213 conflict with D211/D212 -- pydocstyle ships mutually exclusive
    # pairs and one side must be chosen. Taking "no blank line before class
    # docstring" and "summary on the first line".
    "D203",
    "D213",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
# NESTING LAW -- how deeply blocks may be indented before ruff refuses. ruff's
# default is 5, which permits exactly the arrow-shaped pyramid the standard bans.
#
# 3, not 2, and the reason matters: PLR1702 counts EVERY block type, not just
# conditionals. A legitimate `try:` -> `async for` -> `with` is three deep and
# contains no branching at all. Requiring 2 would refuse correct structural code
# and train people to add noqa, which is how a rule stops meaning anything.
#
# 3 still refuses `if` inside `if` inside `if`, which is the actual target.
max-nested-blocks = 3

[tool.ruff.lint.per-file-ignores]
# Tests document themselves through their names; a docstring on every test
# function is noise that trains people to write empty ones. D102 covers test
# methods inside a grouping class, which are the same thing as D103 functions.
# The grouping CLASS still needs its docstring (D101 stays on): a test class is
# a claim about a behaviour, and that claim is worth stating.
"tests/*" = ["D100", "D102", "D103"]
# Scripts are CLIs; printing is their job.
"scripts/**" = ["T20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openbrain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# docs/standards/STANDARDS-python.md:951. "auto" means an `async def test_`
# is awaited without a marker. Under the default "strict" mode an unmarked
# coroutine test is COLLECTED, NOT AWAITED, and reported as passing -- the
# same defect class as ruff PLR1702 without `preview` and as a mypy path that
# resolves to nothing: a check that examines nothing reports success.
asyncio_mode = "auto"
