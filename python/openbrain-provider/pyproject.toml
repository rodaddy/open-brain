[project]
name = "openbrain-provider"
version = "0.1.0"
description = "Runtime lifecycle provider for Open Brain: session start, capture, checkpoint, reflex, and the agent hooks that drive them."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Reference implementation of rtech-standards/OBSERVABILITY_CONTRACT.md.
    # That document is normative ("if an implementation and this document
    # disagree, this document wins and the implementation is a bug") and ships
    # this package so nine repos do not each grow their own logger. loguru is a
    # transitive dep of it; depending on loguru directly is how a second,
    # non-conforming logger gets written.
    "rtech-obs>=1.1.0",
    # The provider dispatches into this package's CLI and imports its domain
    # vocabulary rather than redeclaring it (#412). Workspace member, resolved
    # from source -- see [tool.uv.sources].
    "openbrain-memory",
]

# [project.scripts] is deliberately absent until PROV-9 (#418) adds
# `cli_provider.py`. A declared entry point whose target module does not exist
# still installs an executable shim into .venv/bin; it just dies with
# ModuleNotFoundError when anything runs it. No lint, type, or test gate looks
# at entry-point targets, so a broken script ships green.
#
# Planned, once the module lands:
#   [project.scripts]
#   ob-memory-provider = "openbrain_provider.cli_provider:main"
#
# The stable command name is the point: it replaces hook entries that hardcode
# absolute paths into a content-addressed `sha256-<hash>` install dir (#420).

[tool.uv.sources]
openbrain-memory = { workspace = true }
# rtech-obs is not published to PyPI. Local path source for dev/CI on this
# checkout; deploys pin it as a git dep. Same convention rtech-agents uses for
# the fleet-bus packages and for openbrain-memory itself.
rtech-obs = { path = "../../../rtech-standards/packages/python", editable = true }

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true

# rtech-obs is fully typed and builds under `strict = true`, but ships no
# py.typed marker, so mypy cannot see any of its annotations from here. Scoped
# to that one module rather than set globally: a blanket
# ignore_missing_imports would hide a genuinely untyped dependency added later.
#
# Upstream fix is one empty file (`src/rtech_obs/py.typed`) plus its wheel
# already including the package dir. Filed rather than patched here because
# rtech-standards is mid-branch on feat/prom-loki-exporters and a drive-by
# commit into another repo's feature branch is worse than a scoped override.
# Remove this block once rtech-obs ships the marker.
[[tool.mypy.overrides]]
module = ["rtech_obs.*", "rtech_obs"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
# D = pydocstyle. Required for new Python per REPO_BOOTSTRAP.md: module (D100),
# package (D104), and class/function (D101-D103) docstrings are gate failures,
# not warnings.
select = ["E", "F", "I", "W", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests document themselves through their names; a docstring on every test
# function is noise that trains people to write empty ones.
"tests/*" = ["D100", "D103"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openbrain_provider"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
