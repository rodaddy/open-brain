[project]
name = "openbrain-provider"
version = "0.9.0"
description = "Runtime lifecycle provider for Open Brain: session start, capture, checkpoint, reflex, and the agent hooks that drive them."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # loguru only. The shared rtech-obs package implements the same envelope
    # and would be the right dependency, but rtech-standards is private and this
    # repo's CI passes no token: SSH fails host-key verification, HTTPS fails
    # with "could not read Username". See observability.py for the full note and
    # the conditions for swapping back.
    "loguru>=0.7",
    # The provider dispatches into this package's CLI and imports its domain
    # vocabulary rather than redeclaring it (#412). Workspace member, resolved
    # from source -- see [tool.uv.sources].
    "openbrain-memory",
]

# A declared entry point whose target module does not exist still installs an
# executable shim into .venv/bin; it just dies with ModuleNotFoundError when
# anything runs it, and no lint, type, or test gate looks at entry-point
# targets -- so a broken script ships green. `tests/test_packaging.py` closes
# that: it parses this table and imports every declared `module:attr`.
#
# Each script is declared only once its module exists. The remaining names from
# the epic's "Home and shape" section -- `ob-memory-provider` and
# `ob-claude-hook` -- arrive with their modules.
#
# THE LIFECYCLE HOOKS ARE NOT AMONG THEM, and that is the part this file used to
# get wrong. PROV-9 (#418) shipped on 2026-08-01 in the SIBLING package: the
# console scripts `~/.claude/settings.json` actually runs after the #420 cutover
# are declared in `python/openbrain/pyproject.toml` and implemented in
# `openbrain/apps/hooks/` --
#
#   openbrain-session-start           = "openbrain.apps.hooks.session_start:main"
#   openbrain-session-start-remaining = "...session_start:main_remaining"
#   openbrain-post-compact            = "openbrain.apps.hooks.post_compact:main"
#   openbrain-capture-stop            = "openbrain.apps.hooks.stop:main"
#   openbrain-capture-subagent-stop   = "openbrain.apps.hooks.subagent_stop:main"
#   openbrain-session-end             = "openbrain.apps.hooks.session_end:main"
#
# So the capture/lifecycle work did not stall here -- it RELOCATED. An earlier
# version of this comment promised a `cli_provider.py` that is not coming, and
# was left uncorrected when the work moved. What this package owns is `config`,
# `constants`, `observability`, `vocabulary` (PROV-1..PROV-3) and the guard
# below; #413-#417 remain open against it, and `docs/architecture.md` carries
# the honest per-component state.
#
# The stable command name is the point: it replaces hook entries that hardcode
# an absolute script path.
[project.scripts]
# Replaces `bun /Volumes/ThunderBolt/Development/_ob/scripts/ob-memory-provider/guard.ts`,
# the PreToolUse/Bash registration in both the Claude and Codex-sol profiles.
# The port is behaviour-preserving; whether PreToolUse should observe or
# enforce remains OPEN as open-brain#451.
ob-guard = "openbrain_provider.cli_guard:main"
# The two hook gates (#419, PROV-10). These replace the six
# `context-budget-gate.ts` and four `policy-refresh-gate.ts` registrations.
# PROV-9's capture/lifecycle scripts live in the sibling `openbrain` package,
# not here.
openbrain-context-budget-gate = "openbrain_provider.context_budget_gate:_cli"
openbrain-policy-refresh-gate = "openbrain_provider.policy_refresh_gate:_cli"

[tool.uv.sources]
openbrain-memory = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true


[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
# D = pydocstyle. Required for new Python per REPO_BOOTSTRAP.md: module (D100),
# package (D104), and class/function (D101-D103) docstrings are gate failures,
# not warnings.
select = ["E", "F", "I", "W", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests document themselves through their names; a docstring on every test
# function is noise that trains people to write empty ones. The same applies
# to a class used purely to group related tests -- and to a nested helper
# stub, which is why D101/D102 are here too.
"tests/*" = ["D100", "D101", "D102", "D103"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openbrain_provider"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
