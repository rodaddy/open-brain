lane = "repo_facts"
subject = "Reconciliation core is I/O-free"
fact_type = "api_contract"
text = """
The core reconcile function accepts preloaded prior positions, current positions, and trades. It compares expected and actual positions, marks expired contracts, extracts BREAK rows, and computes the summary without performing file, database, or network I/O; loaders belong at the caller boundary.\
"""
