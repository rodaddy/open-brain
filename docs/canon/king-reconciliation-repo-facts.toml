lane = "repo_facts"
subject = "Break classification vocabulary"
fact_type = "workflow"
text = """
Quantity breaks are classified as unexpected_close, unexpected_open, missing_trade, or qty_mismatch from prior quantity, signed trade quantity, and actual quantity. The classifier is pure and every break receives exactly one of these root-cause categories.\
"""
