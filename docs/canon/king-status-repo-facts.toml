lane = "repo_facts"
subject = "Combined board, CI, and health status"
fact_type = "api_contract"
text = """
GET /api/status returns the cached GitHub project board summary, service health results, CI results, and the last update time. Pollers refresh board, CI, and health together at POLL_INTERVAL_MS, which defaults to five minutes.\
"""
source = "src/index.ts; https://github.com/King-Capital/king-status/blob/bc67563f9842652077caaddffeae5830289a09dc/src/index.ts; verified_at=2026-08-05T23:58:51Z; source_commit=bc67563f9842652077caaddffeae5830289a09dc"

