subject = "Admin mutation authentication"
fact_type = "gotcha"
text = """
Strategic writes, rollbacks, reseeds, diagnostics, and project-board mutations require x-admin-token. If ADMIN_TOKEN is unset, admin endpoints are disabled with 403; supplied values are compared with timingSafeEqual and failures produce HTTP 401.\
"""
