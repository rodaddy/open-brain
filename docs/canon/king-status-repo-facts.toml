[[entries]]
key = "repo.king_status.ci_scope"
lane = "repo_facts"
subject = "CI does not run the Bun test suite"
fact_type = "validation"
text = """
Pull request CI runs lint, typecheck, and the client build on the self-hosted king-status runner. It does not run `bun test`, so a green workflow does not prove tests passed; run the Bun test suite separately when behavior changes.\
"""
