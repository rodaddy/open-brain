# OPEN BRAIN REPO FACTS — 5 operational truths from the #522 harvest, walked
# with Rico 2026-08-03. One harvested fact (CI container bridge networking)
# was DROPPED by his call: it self-documents in .github/workflows/ci.yml and
# the runner fleet is migrating to the software factory.
#
# STATUS: WRITTEN, awaiting Rico's read-through (merge = approval), then
# `openbrain-canon-reconcile --apply`. repo_facts bind to the repo slug
# (git-root basename, lowercased) and travel the upsert_repo_fact route with
# file-at-commit provenance — not the guidance-lane promote path.

kind = "canon"

[[entries]]
key = "repo.ci_uses_runner_local_postgres_not_docker"
lane = "repo_facts"
subject = "CI database"
fact_type = "gotcha"
text = """
CI runs against the Postgres already installed natively on the self-hosted \
runner LXCs. NEVER add a Docker services: database block to a workflow — it \
collides with the local Postgres on port 5432 and fails at container init. \
(The one deliberate container is the db-integration job's throwaway \
Postgres 18, run with --network host on a free port; it exists because the \
runner-native Postgres is v17 and shared, and restore tests are destructive.)\
"""
source = "open-brain PR #84, .github/workflows/ci.yml; approved 2026-08-03"

[[entries]]
key = "repo.health_check_uses_public_health_endpoint"
lane = "repo_facts"
subject = "health checks"
fact_type = "gotcha"
text = """
Health checks hit /health — public, unauthenticated. /mcp requires a bearer \
token and answers an unauthenticated probe with 401, so monitoring pointed at \
it reports a healthy service as down. That happened; do not repeat it.\
"""
source = "open-brain PR #89; approved 2026-08-03"

[[entries]]
key = "repo.core01_service_user_not_root"
lane = "repo_facts"
subject = "core01 service domain"
fact_type = "gotcha"
text = """
Services run as a user, NEVER root; grant the user targeted passwordless sudo \
where genuinely needed. The core01 Open Brain service is a per-user \
LaunchAgent (gui/<uid>/com.rico.open-brain): a deploy targeting the system \
domain fails with exit 113 and SILENTLY leaves the old process running with \
new code staged beside it. scripts/core01-deploy-local.sh defaults to the gui \
domain — keep it that way.\
"""
source = "open-brain#287, scripts/core01-deploy-local.sh; [REWORDED 2026-08-03 to Rico's user-not-root principle]"

[[entries]]
key = "repo.open_brain.apple_silicon_idle_signal"
lane = "repo_facts"
subject = "model scheduling signal"
fact_type = "gotcha"
text = """
On Apple Silicon, CPU idle and GPU utilization are the WRONG signals for \
'room to run a model' — unified memory means the model competes with Postgres \
for the same pool, and a 90%-CPU-idle box can have no headroom without \
evicting Postgres cache. Schedule model work on Open Brain's own \
last-MCP-request time plus memory headroom.\
"""
source = "open-brain#389 (Epic DREAM), docs/dream-design.md; approved 2026-08-03"

[[entries]]
key = "repo.open_brain.context_pack_requested_sections"
lane = "repo_facts"
subject = "agent_context_pack request shape"
fact_type = "api_contract"
text = """
agent_context_pack takes requested_sections — NOT sections. Today an unknown \
key is silently ignored and the call returns a near-empty default pack that \
looks like success; all five scope fields (agent, platform, server_id, \
channel_id, session_key) are required. #535 makes the unknown-key case fail \
loudly; RETIRE this fact (relegate on this key) when #535 lands — the code \
replaces the warning sign.\
"""
source = "open-brain#439/#526, src/tools/agent-context-pack.ts; approved 2026-08-03 as interim until #535"
