"""
source = "README.md; https://github.com/King-Capital/king-agents/blob/420a22e22498cad7574a5f9e7893e7d08cdb80ee/README.md#L137; verified_at=2026-08-03T16:17:42Z; source_commit=420a22e22498cad7574a5f9e7893e7d08cdb80ee"

[[entries]]
key = "repo.king_agents.pre_commit_hook_enforces_tsdoc_and_blocks_protected_branches"
lane = "repo_facts"
subject = "Pre-commit hook enforces TSDoc and blocks protected branches"
fact_type = "workflow"
text = """
`core.hooksPath` is set to `.githooks` by the package `prepare` script, and `.githooks/pre-commit` blocks commits on main/master/develop/production/staging, runs ggshield secret scanning, and BLOCKS the commit when staged `.ts`/`.tsx` files lack TSDoc `@module` and `@description` tags. It also regenerates and auto-stages per-folder `src/**/README.md` files.\
"""
source = ".githooks/pre-commit; https://github.com/King-Capital/king-agents/blob/420a22e22498cad7574a5f9e7893e7d08cdb80ee/.githooks/pre-commit#L47; verified_at=2026-08-03T16:17:42Z; source_commit=420a22e22498cad7574a5f9e7893e7d08cdb80ee"

[[entries]]
key = "repo.king_agents.private_king_capital_dependency_requires_a_token"
lane = "repo_facts"
subject = "Private @king-capital dependency requires a token"
fact_type = "dependency"
text = """
The repo depends on `@king-capital/core` from the GitHub Packages registry, and `.npmrc` authenticates with `${NODE_AUTH_TOKEN}`. `bun install --frozen-lockfile` fails without that token exported (CI supplies it from the `GH_PAT` secret and hard-fails when it is unset).\
"""
source = ".npmrc; https://github.com/King-Capital/king-agents/blob/420a22e22498cad7574a5f9e7893e7d08cdb80ee/.npmrc#L2; verified_at=2026-08-03T16:17:42Z; source_commit=420a22e22498cad7574a5f9e7893e7d08cdb80ee"

[[entries]]
key = "repo.king_agents.runtime_stack_and_service_shape"
lane = "repo_facts"
subject = "Runtime stack and service shape"
fact_type = "dependency"
text = """
king-agents is a Bun + Hono HTTP service on port 3400 (env `PORT`) for King Capital. All LLM inference routes through a LiteLLM proxy at `LITELLM_BASE_URL`; persistence is PostgreSQL (`DATABASE_URL` = king_dashboard DB, `MARKET_DATABASE_URL` = read-only CT 304 market data DB). Logging is Pino via `src/lib/logger.ts` and `console.log` is banned anywhere in the repo (CLAUDE.md:47,89).\
"""
source = "README.md; https://github.com/King-Capital/king-agents/blob/420a22e22498cad7574a5f9e7893e7d08cdb80ee/README.md#L117; verified_at=2026-08-03T16:17:42Z; source_commit=420a22e22498cad7574a5f9e7893e7d08cdb80ee"

[[entries]]
key = "repo.king_agents.test_environment_is_preloaded_and_stubbed"
lane = "repo_facts"
subject = "Test environment is preloaded and stubbed"
fact_type = "validation"
text = """
`bunfig.toml` preloads `tests/setup.ts` for every `bun test` run, which forces `DATABASE_URL` to a throwaway `postgresql://test:test@localhost:5432/test`, points `LITELLM_BASE_URL` at a mock `http://localhost:9999`, silences logs, and deletes `AGENT_API_KEY`. Tests therefore never hit the real DB or LLM proxy, and auth-dependent code paths see no API key by default.\
"""
source = "bunfig.toml; https://github.com/King-Capital/king-agents/blob/420a22e22498cad7574a5f9e7893e7d08cdb80ee/bunfig.toml#L2; verified_at=2026-08-03T16:17:42Z; source_commit=420a22e22498cad7574a5f9e7893e7d08cdb80ee"
