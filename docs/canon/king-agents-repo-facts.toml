[[entries]]
key = "repo.king_agents.daily_post_signal_chain_endpoint"
lane = "repo_facts"
subject = "Daily post-signal chain endpoint"
fact_type = "workflow"
text = """
`POST /api/daily-chain/run` is the local orchestration entrypoint that runs after king-signals writes daily `pipeline_output_records`: it loads the latest completed king-signals daily batch, runs analyst reports, synthesizes the strategist report, runs portfolio risk, and optionally posts to `DAILY_REPORT_WEBHOOK_URL`. It is API-key protected via `AGENT_API_KEY` in production; pass `skipDelivery: true` to run without sending the report.\
"""
source = "README.md; https://github.com/King-Capital/king-agents/blob/420a22e22498cad7574a5f9e7893e7d08cdb80ee/README.md#L55; verified_at=2026-08-03T16:17:42Z; source_commit=420a22e22498cad7574a5f9e7893e7d08cdb80ee"

