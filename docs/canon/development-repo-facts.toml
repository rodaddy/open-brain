subject = "_ob/scripts is the only Node/TS project in the tree"
fact_type = "dependency"
text = """
`_ob/scripts/` is a scoped Bun/TypeScript project with its own package.json and tsconfig.json so editors and LSP servers resolve types without a repo-root Node project. Typecheck with `bun run check` (tsc --noEmit) and run its unit tests with `bun test` from inside that directory.\
"""
