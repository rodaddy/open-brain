[[entries]]
key = "repo.development.repo_shape_umbrella_workspace_that_ignores_everything_by_default"
lane = "repo_facts"
subject = "Repo shape: umbrella workspace that ignores everything by default"
fact_type = "workflow"
text = """
/Volumes/ThunderBolt/Development is an umbrella control-plane workspace, not an ordinary project: .gitignore line 3 is a bare `*` so everything is ignored by default, and only explicit un-ignores are tracked (AGENTS.md, CLAUDE.md, GEMINI.md, _AGENTS.md, GLOSSARY.md, justfile, specs/, .claude/settings.json, and the _DOCS/ and _ob/ trees). Every child directory (open-brain, rtech-infra, king-capital, etc.) is a standalone repo with its own git history -- commit work in the repo that owns the files, never here.\
"""
source = ".gitignore; https://github.com/rodaddy/development/blob/73f29e7aec6f7fd892642865ad33f8a40feab817/.gitignore#L3; verified_at=2026-08-03T16:17:42Z; source_commit=73f29e7aec6f7fd892642865ad33f8a40feab817"

