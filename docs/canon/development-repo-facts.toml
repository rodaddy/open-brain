[[entries]]
key = "repo.development.worktree_lsp_bootstrap"
lane = "repo_facts"
subject = "Worktree LSP bootstrap"
fact_type = "workflow"
text = """
From a fresh worktree, prepare every detected language project with `bun _ob/scripts/lsp-worktree.ts bootstrap` -- it is manifest-driven (Bun for TypeScript, uv for Python, Go modules, SwiftPM, Cargo, compile_commands.json for C/C++, and xcode-build-server for Xcode project/workspace bundles), creates no global environment, and suppresses no diagnostics. `bun _ob/scripts/lsp-worktree.ts doctor` is the read-only environment check.\
"""
source = "_ob/scripts/README.md; https://github.com/rodaddy/development/blob/73f29e7aec6f7fd892642865ad33f8a40feab817/_ob/scripts/README.md#L9; verified_at=2026-08-03T16:17:42Z; source_commit=73f29e7aec6f7fd892642865ad33f8a40feab817"
