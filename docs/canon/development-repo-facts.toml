[[entries]]
key = "repo.development.development_session_start_runtime_context"
lane = "repo_facts"
subject = "Development session-start runtime context"
fact_type = "workflow"
text = """
Session start reads the repo-fact UUID from AGENTS.md, fetches this entity directly with get_entity, validates the source commit and SHA-256, then proceeds. Fallback is only the named source doc; normal discovery is OB/qmd then mdfind then rg. Known vetted tools run directly. Claude and Codex are rollout gates; Pi is best-effort and must not block them. Fleet host access: SSH to an agent host as that agent user (skippy@10.71.20.111, bilby@10.71.20.71) — the agent user owns ~/.hermes, its systemd user units, and its process view; resolve named hosts via rtech-infra/HOSTMAP.md, never recall IPs.\
"""
source = "_ob/repo-context/development.md; https://github.com/rodaddy/development/blob/3c2bdc36f27407e64f44d9a69a15ee296ea26510/_ob/repo-context/development.md; verified_at=2026-07-13T16:37:58Z; source_commit=3c2bdc36f27407e64f44d9a69a15ee296ea26510"

[[entries]]
key = "repo.development.just_recipes_launch_cmux_agent_rooms"
lane = "repo_facts"
subject = "just recipes launch CMUX agent rooms"
fact_type = "workflow"
text = """
The root `justfile` exposes CMUX room launchers, not build steps: `just start` (alias `s`) opens this repo's standard CMUX room with Claude as the default main agent (pass `codex` to switch), `just swarm` (`sw`) adds a scribe watcher pane that tails `_reports/verified-swarm/*/ledger.jsonl`, and `just fast|cc|cockpit|pi|room` launch CMUX presets. Recipes run under `zsh -cu`.\
"""
source = "justfile; https://github.com/rodaddy/development/blob/73f29e7aec6f7fd892642865ad33f8a40feab817/justfile#L14; verified_at=2026-08-03T16:17:42Z; source_commit=73f29e7aec6f7fd892642865ad33f8a40feab817"

