[[entries]]
key = "repo.king_core.database_ddl_protocol"
lane = "repo_facts"
subject = "Database DDL protocol"
fact_type = "migration"
text = """
All schema changes go through Drizzle migrations committed under `drizzle/` and applied by CI; raw `CREATE TABLE`/`ALTER TABLE` against any database is forbidden because it breaks `__drizzle_migrations` SHA tracking. DDL to the market-data DB (CT 304) is applied only after review, and DDL to prod (CT 302, `king_dashboard`) is Rico-gated. Local migration entry point is `bun run db:migrate`.\
"""
source = "docs/DDL-PROTOCOL.md; https://github.com/King-Capital/king-core/blob/991e1c4a647dffac22402955076beb14eff4fc87/docs/DDL-PROTOCOL.md#L95; verified_at=2026-08-03T16:17:42Z; source_commit=991e1c4a647dffac22402955076beb14eff4fc87"

[[entries]]
key = "repo.king_core.package_identity_and_consumption"
lane = "repo_facts"
subject = "Package identity and consumption"
fact_type = "dependency"
text = """
This repo publishes the private npm package `@king-capital/core` to GitHub Packages (registry https://npm.pkg.github.com, access restricted) and is the single source of truth for shared types, the product universe, and DB schema across all King Capital service repos. Never duplicate a type from here into a service repo; breaking changes require coordinating every downstream king-* consumer.\
"""
source = "package.json; https://github.com/King-Capital/king-core/blob/991e1c4a647dffac22402955076beb14eff4fc87/package.json#L2; verified_at=2026-08-03T16:17:42Z; source_commit=991e1c4a647dffac22402955076beb14eff4fc87"

[[entries]]
key = "repo.king_core.pre_commit_tsdoc_gate_and_generated_code"
lane = "repo_facts"
subject = "Pre-commit TSDoc gate and generated code"
fact_type = "workflow"
text = """
A `.githooks/pre-commit` hook runs `scripts/check-tsdoc.ts` over staged `.ts` files and exits non-zero when `@module`/`@description` tags are missing, so commits are blocked without them; `bun run prepare` wires `core.hooksPath` to `.githooks`. Do not hand-edit `src/generated/cqg/` -- it is generated protobuf, regenerated by the build.\
"""
source = ".githooks/pre-commit; https://github.com/King-Capital/king-core/blob/991e1c4a647dffac22402955076beb14eff4fc87/.githooks/pre-commit#L47; verified_at=2026-08-03T16:17:42Z; source_commit=991e1c4a647dffac22402955076beb14eff4fc87"

[[entries]]
key = "repo.king_core.publish_is_tag_driven_on_a_self_hosted_runner"
lane = "repo_facts"
subject = "Publish is tag-driven on a self-hosted runner"
fact_type = "workflow"
text = """
Publishing happens only when a `v*` git tag is pushed: `.github/workflows/publish.yml` runs on the self-hosted `[self-hosted, king-core]` runner with Bun 1.3.10 and executes `bun install --frozen-lockfile`, `bun run typecheck`, `bun test`, `bun run build`, then `bun publish --access restricted`. Bump the version in package.json first, then tag.\
"""
source = ".github/workflows/publish.yml; https://github.com/King-Capital/king-core/blob/991e1c4a647dffac22402955076beb14eff4fc87/.github/workflows/publish.yml#L5; verified_at=2026-08-03T16:17:42Z; source_commit=991e1c4a647dffac22402955076beb14eff4fc87"

