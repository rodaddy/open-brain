[[entries]]
key = "repo.king_core.there_is_a_real_build_step_exports_resolve_to_dist"
lane = "repo_facts"
subject = "There is a real build step; exports resolve to dist/"
fact_type = "dependency"
text = """
Consumers get compiled output, not source: `files` publishes only `dist/` and `src/proto/`, and every subpath export (`./types`, `./db-schema`, `./products`, `./contracts`, `./nats`, etc.) maps to `./dist/...`. `bun run build` is `tsc` plus copying `src/generated/cqg/cqg.d.ts` and `src/config/*.yaml` into `dist/`, so a plain `tsc` alone leaves the package incomplete. (README.md:184 still claims "No build step" -- that line is wrong.)\
"""
source = "package.json; https://github.com/King-Capital/king-core/blob/991e1c4a647dffac22402955076beb14eff4fc87/package.json#L157; verified_at=2026-08-03T16:17:42Z; source_commit=991e1c4a647dffac22402955076beb14eff4fc87"

