[[entries]]
key = "repo.king_dashboard.ci_does_not_run_tests"
lane = "repo_facts"
subject = "CI does not run tests"
fact_type = "validation"
text = """
The CI workflow has only four jobs -- `lint`, `no-sudo-check`, `build`, and `gate` -- and never invokes `bun test`, so a green CI run proves nothing about the Vitest suite. Tests are the author's responsibility: run `bun test` and `bun run build` locally before pushing.\
"""
source = ".github/workflows/ci.yml; https://github.com/King-Capital/king-dashboard/blob/4c39989a2729539710ba5961dc84fadd93e82cac/.github/workflows/ci.yml#L14; verified_at=2026-08-03T16:17:42Z; source_commit=4c39989a2729539710ba5961dc84fadd93e82cac"

