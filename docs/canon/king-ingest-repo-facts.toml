[[entries]]
key = "repo.king_ingest.pre_commit_hook_is_blocking"
lane = "repo_facts"
subject = "Pre-commit hook is blocking"
fact_type = "workflow"
text = """
`.githooks/pre-commit` (wired up by the `prepare` script setting `core.hooksPath`) runs ggshield secret scanning when installed, then blocks the commit if any staged `.ts`/`.tsx` file is missing TSDoc `@module`/`@description` tags. It then auto-generates per-folder `src/**/README.md` files and applies `biome check --write`, re-staging both -- so a commit can add files you did not stage. The TSDoc/README steps run via the parent workspace's `scripts/check-tsdoc.ts` and `scripts/gen-readme.ts`; if king-ingest is checked out outside the king-capital workspace the hook prints "workspace scripts not found" and exits 0.\
"""
source = ".githooks/pre-commit; https://github.com/King-Capital/king-ingest/blob/99c3828c883aa19b561fb64d79eb6d601bd1efd7/.githooks/pre-commit#L47; verified_at=2026-08-03T16:17:42Z; source_commit=99c3828c883aa19b561fb64d79eb6d601bd1efd7"

[[entries]]
key = "repo.king_ingest.runtime_and_entrypoints"
lane = "repo_facts"
subject = "Runtime and entrypoints"
fact_type = "dependency"
text = """
king-ingest is a Bun/TypeScript service with two entrypoints: the pipeline orchestrator `bun src/main.ts --pipeline <name>` (or `--all`), which runs an ingestion pipeline and exits, and a Hono API server `bun src/server.ts` (npm script `service:api`) that listens on `PORT` defaulting to 3500 and receives Bloomberg data pushes from WSL2. Auth on the API server is fail-closed and requires `API_KEY` in the environment.\
"""
source = "CLAUDE.md; https://github.com/King-Capital/king-ingest/blob/99c3828c883aa19b561fb64d79eb6d601bd1efd7/CLAUDE.md#L67; verified_at=2026-08-03T16:17:42Z; source_commit=99c3828c883aa19b561fb64d79eb6d601bd1efd7"
