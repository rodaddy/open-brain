key = "repo.king_ingest.databases_written"
lane = "repo_facts"
subject = "Databases written"
fact_type = "migration"
text = """
Pipelines write to the market data PostgreSQL DB on CT 304 via `MARKET_DATA_DATABASE_URL`, which is required (`src/lib/env.ts:12`; `src/lib/db.ts:18` throws without it) and is the write target for futures bars, weather, COT, EIA, and warehouse stocks. `DATABASE_URL` (the king_dashboard DB) is documented in the README config table but is `optional()` in the env schema and is not read anywhere in `src/` -- treat it as legacy, not a requirement for a full run.\
"""
source = "src/lib/env.ts; https://github.com/King-Capital/king-ingest/blob/99c3828c883aa19b561fb64d79eb6d601bd1efd7/src/lib/env.ts#L12; verified_at=2026-08-03T16:17:42Z; source_commit=99c3828c883aa19b561fb64d79eb6d601bd1efd7"

[[entries]]
key = "repo.king_ingest.deploy_target_and_scheduling"
lane = "repo_facts"
subject = "Deploy target and scheduling"
fact_type = "workflow"
text = """
This service deploys only to CT 304 at 10.71.20.16 (the market data DB LXC, co-located with the data) and never to CT 302 prod. Scheduling is systemd timers, not cron: `infrastructure/*.service` and `*.timer` units are copied to `/etc/systemd/system/` by the deploy workflow. The `.env` file lives at `/home/king/king-ingest/.env` on CT 304 and survives deploys.\
"""
source = ".github/workflows/deploy.yml; https://github.com/King-Capital/king-ingest/blob/99c3828c883aa19b561fb64d79eb6d601bd1efd7/.github/workflows/deploy.yml#L22; verified_at=2026-08-03T16:17:42Z; source_commit=99c3828c883aa19b561fb64d79eb6d601bd1efd7"

[[entries]]
key = "repo.king_ingest.frd_bulk_ingest_uses_psql_copy_not_bun"
lane = "repo_facts"
subject = "FRD bulk ingest uses psql COPY, not Bun"
fact_type = "dependency"
text = """
The FRD futures-bar pipeline delegates bulk loading to the shell script `infrastructure/frd-ingest.sh` (curl to 7z to `xargs -P4 psql COPY`), which TypeScript spawns via `Bun.spawn`. This is deliberate: Bun/V8 OOM'd at 14 GB on the 1min zip (3.9 GB, 33.5M rows) while psql COPY does it in 281 MB peak over 3.5 minutes. Do not rewrite the bulk path in TypeScript; TS keeps only trading-day detection, `run_log` logging, gap detection, CSV parsing, and symbol mapping.\
"""
source = "README.md; https://github.com/King-Capital/king-ingest/blob/99c3828c883aa19b561fb64d79eb6d601bd1efd7/README.md#L154; verified_at=2026-08-03T16:17:42Z; source_commit=99c3828c883aa19b561fb64d79eb6d601bd1efd7"

