[[entries]]
key = "repo.king_trading.health_semantics"
lane = "repo_facts"
subject = "Liveness and readiness are different endpoints"
fact_type = "api_contract"
text = """
Use GET /health/live for deployment liveness: it returns 200 when the HTTP server is running even if CQG is not ready. GET /health is readiness and returns 503 until server startup is complete and the trading client reports loggedIn.\
"""
source = "src/server.ts; https://github.com/King-Capital/king-trading/blob/3330edb8a367279a3c5d2c983a1d38a711bf7bf0/src/server.ts; verified_at=2026-08-05T23:58:51Z; source_commit=3330edb8a367279a3c5d2c983a1d38a711bf7bf0"

[[entries]]
key = "repo.king_trading.pretrade_risk"
lane = "repo_facts"
subject = "Pre-trade risk checks"
fact_type = "validation"
text = """
Order submission validates maximum order size, resulting position size, per-position daily P&L, and limit/stop price reasonability against last price and ATR. Portfolio P&L has a separate aggregate daily-loss check; callers must route orders through OrderManager rather than bypass these checks.\
"""
source = "src/lib/orders/risk-checks.ts; https://github.com/King-Capital/king-trading/blob/3330edb8a367279a3c5d2c983a1d38a711bf7bf0/src/lib/orders/risk-checks.ts; verified_at=2026-08-05T23:58:51Z; source_commit=3330edb8a367279a3c5d2c983a1d38a711bf7bf0"

