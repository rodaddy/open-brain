lane = "repo_facts"
subject = "Pull request CI gates"
fact_type = "validation"
text = """
Pull request CI runs on the self-hosted king-trading runner and has separate lint, typecheck, and test jobs. The typecheck job performs a Next.js build before `tsc --noEmit`; the test job runs the full `bun test` suite.\
"""
source = ".github/workflows/ci.yml; https://github.com/King-Capital/king-trading/blob/3330edb8a367279a3c5d2c983a1d38a711bf7bf0/.github/workflows/ci.yml; verified_at=2026-08-05T23:58:51Z; source_commit=3330edb8a367279a3c5d2c983a1d38a711bf7bf0"

[[entries]]
key = "repo.king_trading.signal_subscription"
lane = "repo_facts"
subject = "Signal subscription and execution path"
fact_type = "workflow"
text = """
king-trading subscribes with `NatsSubjects.signal(envPrefix, "*", ">")`. Received king-signals payloads are queued; qualifying auto-execution either submits to the netting coordinator or calls OrderManager directly, so both paths retain the order risk boundary. NATS unavailability disables the subscriber but does not stop the server.\
"""
source = "src/lib/signals/subscriber.ts; https://github.com/King-Capital/king-trading/blob/3330edb8a367279a3c5d2c983a1d38a711bf7bf0/src/lib/signals/subscriber.ts; verified_at=2026-08-05T23:58:51Z; source_commit=3330edb8a367279a3c5d2c983a1d38a711bf7bf0"

