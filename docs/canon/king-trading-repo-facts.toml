[[entries]]
key = "repo.king_trading.mode_and_ws_guard"
lane = "repo_facts"
subject = "Trading modes and WebSocket command guard"
fact_type = "gotcha"
text = """
TRADING_MODE is one of mock, paper, or live and defaults to mock. Mock mode requires the built-in gateway. Inbound UI WebSocket commands require WS_COMMAND_TOKEN of at least 16 characters, and the server binds to 127.0.0.1 unless SERVER_BIND_ADDRESS is explicitly changed.\
"""
source = "src/config/env.ts; https://github.com/King-Capital/king-trading/blob/3330edb8a367279a3c5d2c983a1d38a711bf7bf0/src/config/env.ts; verified_at=2026-08-05T23:58:51Z; source_commit=3330edb8a367279a3c5d2c983a1d38a711bf7bf0"

[[entries]]
key = "repo.king_trading.runtime_shape"
lane = "repo_facts"
subject = "Two-process runtime shape"
fact_type = "workflow"
text = """
Run king-trading as two processes: `bun run server` owns CQG, orders, NATS, HTTP health, and UI WebSockets on SERVER_PORT (default 3400); `bun run dev` owns the Next.js dashboard. Both are required for the full application.\
"""
source = "CLAUDE.md; https://github.com/King-Capital/king-trading/blob/3330edb8a367279a3c5d2c983a1d38a711bf7bf0/CLAUDE.md; verified_at=2026-08-05T23:58:51Z; source_commit=3330edb8a367279a3c5d2c983a1d38a711bf7bf0"
