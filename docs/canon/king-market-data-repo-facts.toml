lane = "repo_facts"
subject = "Headless server starts idle"
fact_type = "workflow"
text = """
The headless `bun run server` path connects to the database and NATS, reports available symbols and contracts, then waits idle. Replay starts only through an explicit --start invocation or an interactive start command with concrete contract codes.\
"""
