[[entries]]
key = "repo.king_market_data.nats_wire"
lane = "repo_facts"
subject = "NATS market-data wire shape"
fact_type = "api_contract"
text = """
Quotes and trades are JSON-encoded MarketDataMessage values published on `NatsSubjects.marketData(envPrefix, symbol, contract)`. The publisher uses the shared @king-capital/core subject convention and drains the NATS connection during shutdown.\
"""
source = "src/lib/nats/publisher.ts; https://github.com/King-Capital/king-market-data/blob/e3cb1fccc73ad3906685446a0395b134ccfd1ee6/src/lib/nats/publisher.ts; verified_at=2026-08-05T23:58:51Z; source_commit=e3cb1fccc73ad3906685446a0395b134ccfd1ee6"

[[entries]]
key = "repo.king_market_data.bar_loading"
lane = "repo_facts"
subject = "Replay bar loading safeguards"
fact_type = "gotcha"
text = """
Replay resolves specific contracts from contract_generics instead of scanning the 223M+ row futures table by root symbol. Bar loads support 1-minute and 5-minute tables, sort chronologically, and stop at 50,000 rows while returning an explicit truncated flag.\
"""
source = "src/lib/scheduler/bar-loader.ts; https://github.com/King-Capital/king-market-data/blob/e3cb1fccc73ad3906685446a0395b134ccfd1ee6/src/lib/scheduler/bar-loader.ts; verified_at=2026-08-05T23:58:51Z; source_commit=e3cb1fccc73ad3906685446a0395b134ccfd1ee6"

[[entries]]
key = "repo.king_market_data.required_config"
lane = "repo_facts"
subject = "Replay configuration fails fast"
fact_type = "dependency"
text = """
MARKET_DATA_DATABASE_URL is required and validated at import time. NATS defaults to localhost with dev subjects, and PLAYBACK_SPEED is constrained to an integer from 1 through 60; invalid configuration prevents startup.\
"""
source = "src/config/env.ts; https://github.com/King-Capital/king-market-data/blob/e3cb1fccc73ad3906685446a0395b134ccfd1ee6/src/config/env.ts; verified_at=2026-08-05T23:58:51Z; source_commit=e3cb1fccc73ad3906685446a0395b134ccfd1ee6"

[[entries]]
key = "repo.king_market_data.session_api"
lane = "repo_facts"
subject = "Session-scoped replay API"
fact_type = "api_contract"
text = """
The Next.js replay API scopes each scheduler by X-Session-Id and supports start, stop, pause, resume, and speed actions. Starts validate a 1-60 speed, resolve contracts over the requested date range, use 1-minute bars for ranges up to one day and 5-minute bars for longer ranges, and stream ticks to that session.\
"""
source = "src/app/api/replay/route.ts; https://github.com/King-Capital/king-market-data/blob/e3cb1fccc73ad3906685446a0395b134ccfd1ee6/src/app/api/replay/route.ts; verified_at=2026-08-05T23:58:51Z; source_commit=e3cb1fccc73ad3906685446a0395b134ccfd1ee6"

[[entries]]
key = "repo.king_market_data.tick_generation"
lane = "repo_facts"
subject = "Synthetic tick generation"
fact_type = "workflow"
text = """
A one-minute OHLCV bar normally becomes 10-20 synthetic ticks, scaled by playback regime and bar duration. Generated prices honor instrument tick size, volume is distributed across ticks, bid/ask quotes and aggressor are produced, and each bar is bounded to at most 100 ticks.\
"""
source = "src/lib/tick-generator/index.ts; https://github.com/King-Capital/king-market-data/blob/e3cb1fccc73ad3906685446a0395b134ccfd1ee6/src/lib/tick-generator/index.ts; verified_at=2026-08-05T23:58:51Z; source_commit=e3cb1fccc73ad3906685446a0395b134ccfd1ee6"
